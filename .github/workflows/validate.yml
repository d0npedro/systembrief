name: Validate n8n workflows

on:
  push:
    branches: [main]
  pull_request:

jobs:
  json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse workflow JSON
        run: |
          python - <<'PY'
          import json, pathlib, sys
          root = pathlib.Path("n8n")
          files = sorted(root.rglob("*.json"))
          if not files:
              raise SystemExit("no n8n/*.json files")
          required = {"name", "nodes", "connections", "settings"}
          for path in files:
              data = json.loads(path.read_text(encoding="utf-8"))
              missing = required - set(data)
              if missing:
                  raise SystemExit(f"{path}: missing {sorted(missing)}")
              names = [n.get("name") for n in data["nodes"]]
              if len(names) != len(set(names)):
                  raise SystemExit(f"{path}: duplicate node names")
              print(f"ok {path} ({len(data['nodes'])} nodes)")
          cloud = json.loads((root / "systembrief-creation-process.cloud.json").read_text(encoding="utf-8"))
          by_name = {node.get("name"): node for node in cloud["nodes"]}
          selector = by_name.get("Kalendertag waehlen", {}).get("parameters", {}).get("jsCode", "")
          if 'if (!row.release_date) { return false; }' not in selector:
              raise SystemExit("cloud release must require an explicit release_date")
          queue_state = by_name.get("Queue awaiting site publication", {}).get("parameters", {}).get("columns", {}).get("value", {}).get("state")
          if queue_state != "awaiting_site_publication":
              raise SystemExit("cloud workflow must not mark an unpublished item as released")
          print(f"{len(files)} workflows valid; cloud release visibility contract valid")
          PY
